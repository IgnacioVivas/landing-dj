  services:
    app:
      build: .
      ports:
        - "127.0.0.1:3000:3000"
      env_file: .env.production
      depends_on:
        db:
          condition: service_healthy
      volumes:
        - uploads_data:/app/public/uploads
      restart: unless-stopped
    db:
      image: postgres:16
      environment:
        POSTGRES_USER: djuser
        POSTGRES_PASSWORD: djpass
        POSTGRES_DB: djdb
      volumes:
        - db_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U djuser -d djdb"]
        interval: 5s
        timeout: 5s
        retries: 5
      restart: unless-stopped
  volumes:
    db_data:
    uploads_data:
